[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "moana-pixel-engine"
dynamic = ["version"]
description = "Infrastructure and contracts for a deterministic Python pixel art engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pillow>=12,<14",
  "numpy>=2.2,<3",
  "aggdraw>=1.3,<2",
  "pydantic>=2.10,<3",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pyyaml>=6,<7",
  "ruff>=0.9,<1",
  "types-pyyaml>=6,<7",
]

[tool.hatch.version]
path = "src/moana/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/moana"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/examples", "/.agents", "/.codex", "/.github", "/MOANA.md", "/AGENTS.md", "/README.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/SECURITY.md", "/pyproject.toml", "/uv.lock", "/.python-version", "/.uv-version", "/.pre-commit-config.yaml", "/.editorconfig", "/.gitattributes", "/.gitignore"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".cache", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["aggdraw"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
markers = [
  "visual: exact pixel regression tests (engine phase)",
  "slow: extended integration cases",
  "security: adversarial inputs and resource budgets",
  "benchmark: informational performance measurements",
]

[tool.coverage.run]
branch = true
source = ["moana"]

[tool.coverage.report]
show_missing = true

[tool.uv]
required-version = ">=0.9,<1"
