name: Quality
# Full matrix only for pull requests targeting main and for commits landing on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # The traced test suite alone takes up to ~12.5 min on Python 3.12 runners (ubuntu
    # and windows); 15 min cancelled jobs before the wheel and determinism steps.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.8"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/validate.py
      - name: Install wheel in isolated environment
        run: uv run --no-sync python -m scripts.check_wheel
      # MOANA-029: fresh processes x PYTHONHASHSEED x key order against the reviewed RGBA
      # manifest; the report and any expected/actual/diff go into the diagnostics artifact.
      - name: Cross-process determinism report
        if: ${{ !cancelled() }}
        run: uv run --no-sync python -m scripts.determinism report --output artifacts/determinism
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: diagnostics-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/
          if-no-files-found: ignore

  determinism:
    # Compares the per-job reports: pixel divergences fail, PNG byte differences between
    # codec builds are listed apart. Read-only; it never updates the RGBA manifest.
    name: Cross-platform determinism
    needs: verify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: diagnostics-*
          path: reports
      # Same uv pin as the verify job; the comparison only needs the standard library.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.8"
          python-version: "3.12"
      - name: Compare determinism reports across the matrix
        run: >-
          uv run --no-project python -m scripts.determinism compare reports --expected-reports 9
          --expected-platforms Darwin,Linux,Windows
          --output artifacts/determinism-summary.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: determinism-summary
          path: artifacts/
          if-no-files-found: ignore
